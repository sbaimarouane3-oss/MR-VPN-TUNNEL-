plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ===== Release signing =====
// Previously buildTypes.release used signingConfigs.debug, which on
// Android's default (auto-created) debug config means a DIFFERENT random
// key on every machine/CI runner - GitHub Actions runners are ephemeral, so
// every build could get signed with a brand new debug key. That's exactly
// why installing a newer APK over an older one failed with "the package
// conflicts with an existing package": Android refuses to update an app
// with an APK signed by a different key than the one already installed.
//
// This reads real release credentials from (in priority order):
//   1) Environment variables KEYSTORE_PATH / KEYSTORE_PASSWORD / KEY_ALIAS /
//      KEY_PASSWORD - used by .github/workflows/build.yml, which decodes a
//      secret into a keystore file and exports these before the build.
//   2) A local keystore.properties file next to this build.gradle (never
//      committed - see .gitignore) - only useful if you ever build a
//      release APK by hand from Termux with `gradle assembleRelease`.
// If neither is present, release falls back to signingConfigs.debug like
// before, so a plain `gradle assembleDebug`/local build never breaks - it
// simply won't be installable over a CI-built release APK, which is
// expected since they're different signing identities.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasLocalKeystoreProps = keystorePropertiesFile.exists()
if (hasLocalKeystoreProps) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def relStoreFile = System.getenv("KEYSTORE_PATH") ?: (hasLocalKeystoreProps ? keystoreProperties['storeFile'] : null)
def relStorePassword = System.getenv("KEYSTORE_PASSWORD") ?: (hasLocalKeystoreProps ? keystoreProperties['storePassword'] : null)
def relKeyAlias = System.getenv("KEY_ALIAS") ?: (hasLocalKeystoreProps ? keystoreProperties['keyAlias'] : null)
def relKeyPassword = System.getenv("KEY_PASSWORD") ?: (hasLocalKeystoreProps ? keystoreProperties['keyPassword'] : null)
def hasReleaseSigning = relStoreFile != null && relStorePassword != null && relKeyAlias != null && relKeyPassword != null

android {
    namespace 'com.sshproxy.vpn'
    compileSdk 35
    ndkVersion "27.2.12479018"

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(relStoreFile)
                storePassword relStorePassword
                keyAlias relKeyAlias
                keyPassword relKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.sshproxy.vpn"
        minSdk 24
        targetSdk 35
        // Overridable from the command line so CI can pass a real,
        // always-increasing value (see build.yml: -PappVersionCode=...).
        // Without that flag (e.g. a plain local build), it falls back to 1 -
        // fine for local testing, since local builds use a different signing
        // identity anyway (see the signing config above) and are never meant
        // to update a CI-built release.
        versionCode (project.hasProperty('appVersionCode') ? project.property('appVersionCode').toInteger() : 1)
        versionName (project.hasProperty('appVersionName') ? project.property('appVersionName') : "1.0")

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                cppFlags ""
            }
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // كل APK كيتبنى بمعمارية وحدة غير (armeabi-v7a أو arm64-v8a) بدل ما
    // تكون الجوج فـ نفس الملف - هادشي كيقسم حجم native libs (Xray-core +
    // hev-socks5-tunnel) بالنصف تقريبًا لكل مستخدم.
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk true  // كيبني تاني نسخة "universal" فيها الجوج، لمن بغيتي APK وحدة تخدم فـ كل جهاز
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

// libv2ray.aar (Xray-core) كيتحط فـ app/libs/ من طرف GitHub Actions قبل
// البناء (شوف .github/workflows/build.yml). flatDir repo ديالو محطوط فـ
// settings.gradle (ماشي هنا) حيت المشروع مضبوط بـ FAIL_ON_PROJECT_REPOS.

dependencies {
    // Fork JSch متوافق مع D8 والـ Android الحديث (يخدم بلا مشاكل ديال JSch الأصلي المهجور)
    implementation 'com.github.mwiede:jsch:0.2.17'
    // Bouncy Castle: JSch (mwiede) محتاجها باش تقدر تستعمل ssh-ed25519/ssh-ed448
    // و curve25519-sha256/curve448-sha512 - بلاها كيشيل هاد الخوارزميات
    // بروحو من الاقتراح (حتى ملي تكون مزيدة فـ setConfig) حيت
    // Android ماعندهاش الدعم ديالهم بشكل أصلي فـ JCA.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Xray-core (V2Ray/VLESS/VMess/Trojan/Shadowsocks) - libv2ray.aar
    // مبني من طرف CI (AndroidLibXrayLite عبر gomobile bind)، شوف build.yml.
    implementation(name: 'libv2ray', ext: 'aar')
}
