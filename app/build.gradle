plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sshproxy.vpn'
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.sshproxy.vpn"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                cppFlags ""
            }
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // كل APK كيتبنى بمعمارية وحدة غير (armeabi-v7a أو arm64-v8a) بدل ما
    // تكون الجوج فـ نفس الملف - هادشي كيقسم حجم native libs (Xray-core +
    // hev-socks5-tunnel) بالنصف تقريبًا لكل مستخدم.
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk true  // كيبني تاني نسخة "universal" فيها الجوج، لمن بغيتي APK وحدة تخدم فـ كل جهاز
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

// libv2ray.aar (Xray-core) كيتحط فـ app/libs/ من طرف GitHub Actions قبل
// البناء (شوف .github/workflows/build.yml). flatDir repo ديالو محطوط فـ
// settings.gradle (ماشي هنا) حيت المشروع مضبوط بـ FAIL_ON_PROJECT_REPOS.

dependencies {
    // Fork JSch متوافق مع D8 والـ Android الحديث (يخدم بلا مشاكل ديال JSch الأصلي المهجور)
    implementation 'com.github.mwiede:jsch:0.2.17'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Xray-core (V2Ray/VLESS/VMess/Trojan/Shadowsocks) - libv2ray.aar
    // مبني من طرف CI (AndroidLibXrayLite عبر gomobile bind)، شوف build.yml.
    implementation(name: 'libv2ray', ext: 'aar')
}
