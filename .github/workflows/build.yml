name: Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      # ===== Xray-core (libv2ray.aar) =====
      # ماكاينش Xray-core كـ Maven dependency جاهز، فكيتبنى مرة وحدة هنا
      # بـgomobile من AndroidLibXrayLite (نفس الطريقة المستعملة فـv2rayNG)
      # وكيتخزن كـ cache باش مايتبناش من جديد فكل build.
      - name: Cache libv2ray.aar
        id: cache-libv2ray
        uses: actions/cache@v4
        with:
          path: app/libs/libv2ray.aar
          key: libv2ray-aar-v1

      - name: Set up Go
        if: steps.cache-libv2ray.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build libv2ray.aar with gomobile
        if: steps.cache-libv2ray.outputs.cache-hit != 'true'
        run: |
          set -e
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          gomobile init

          git clone --depth 1 https://github.com/2dust/AndroidLibXrayLite.git /tmp/AndroidLibXrayLite
          cd /tmp/AndroidLibXrayLite
          go mod tidy -v
          gomobile bind -v -androidapi 24 -trimpath \
            -ldflags='-s -w -buildid= -checklinkname=0' \
            -o libv2ray.aar \
            ./

          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libv2ray.aar "$GITHUB_WORKSPACE/app/libs/libv2ray.aar"

      - name: Verify libv2ray.aar present
        run: ls -la app/libs/libv2ray.aar

      # ملاحظة: المشروع ماعندوش سكريبت gradlew (gradle/wrapper/ فيه غير
      # gradle-wrapper.properties)، فكنستعملو setup-gradle باش يجيب نفس
      # نسخة Gradle (8.7) المحددة فـ gradle-wrapper.properties ويخدمها
      # مباشرة، بلا حاجة لـ ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # كيفك الـkeystore (release.keystore.jks) من secret مشفر base64 -
      # نفسو فكل build، حيت GitHub Actions runners مؤقتين وكل build كان
      # كيولد debug.keystore عشوائي جديد (هادشي هو السبب ديال "الحزمة
      # تتعارض مع الحزمة الحالية" عند كل تحديث). خاصك تزيد هاد الـsecrets
      # مرة وحدة فـ Settings > Secrets and variables > Actions:
      #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.keystore.jks"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }}

      - name: Remove Release Keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore.jks"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
